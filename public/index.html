<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ปฏิทินยา</title>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 480px;
      margin: 0 auto;
      padding: 24px;
      background: #f7f7f7;
    }

    .card {
      background: white;
      padding: 24px;
      border-radius: 18px;
      text-align: center;
    }

    #profileImage {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      object-fit: cover;
      display: none;
      margin: 0 auto 16px;
    }

    #status {
      margin-top: 16px;
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>💊 ปฏิทินยา</h2>

    <img id="profileImage" alt="LINE Profile">

    <h3 id="displayName">กำลังเชื่อมต่อ LINE...</h3>

    <p id="status">
      ระบบแจ้งเตือนการสั่งยาและเข้ารับยา
    </p>
  </div>

  <script>
    const LIFF_ID = "2011081168-vX5joQV5";

    async function main() {
      try {
        await liff.init({
          liffId: LIFF_ID
        });

        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }

        const profile = await liff.getProfile();

        document.getElementById("displayName").textContent =
          "สวัสดี " + profile.displayName;

        if (profile.pictureUrl) {
          const img = document.getElementById("profileImage");
          img.src = profile.pictureUrl;
          img.style.display = "block";
        }

        document.getElementById("status").textContent =
          "เชื่อมต่อบัญชี LINE สำเร็จ ✓";

      } catch (error) {
        console.error(error);

        document.getElementById("displayName").textContent =
          "เกิดข้อผิดพลาด";

        document.getElementById("status").textContent =
          error.message;
      }
    }

    main();
  </script>

</body>
</html>
